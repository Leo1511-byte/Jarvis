[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop command center"
edition = "2021"
# 2026-08-15: src/bin/gemini_live_spike.rs (M42 spike) made this crate have
# two binaries, which broke `cargo run` -- and by extension Tauri's dev
# command -- with "could not determine which binary to run". This pins the
# real app as the default; the spike still runs via `cargo run --bin
# gemini_live_spike` explicitly.
default-run = "jarvis"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri-plugin-single-instance = "2.4.3"
objc2-avf-audio = "0.3.2"
livekit-wakeword = "0.1.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
rustls = { version = "0.23.43", features = ["ring"] }

[[bin]]
name = "jarvis"
path = "src/main.rs"
