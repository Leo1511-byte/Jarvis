[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop command center"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Milestone 37 (system_stats.rs) needs `sysinfo` -- deliberately NOT added
# here as a guessed version string (no cargo in this session to resolve
# it correctly, and a wrong pin would break the whole build before
# system_stats.rs's own code is even reached). Run `cargo add sysinfo`
# from apps/desktop/backend/ first; see docs/archive/
# HANDOFF_M37_SYSTEM_STATS_RUST_VERIFICATION.md.

[[bin]]
name = "jarvis"
path = "src/main.rs"
