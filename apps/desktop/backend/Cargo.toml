[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop command center"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jarvis"
path = "src/main.rs"
